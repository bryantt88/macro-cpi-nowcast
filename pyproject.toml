[project]
name = "macro-nowcast"
version = "0.1.0"
description = "Point-in-time nowcast of 1-month-ahead US headline CPI (config-swappable target) from free macro data."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "SQLAlchemy>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[project.scripts]
# Wired now, implemented stage-by-stage. Each is a thin CLI over one pipeline stage.
macro-initdb   = "macro_nowcast.cli:cmd_initdb"     # Stage 1: create empty DB schema
macro-ingest   = "macro_nowcast.cli:cmd_ingest"     # Stage 2: pull sources -> DB
macro-features = "macro_nowcast.cli:cmd_features"    # Stage 3: build point-in-time features
macro-train    = "macro_nowcast.cli:cmd_train"      # Stage 4: walk-forward train + score
macro-report   = "macro_nowcast.cli:cmd_report"     # Stage 5: markdown report

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
